name: Publish

on:
  push:
    branches:
      - "*"
  workflow_dispatch:
    inputs:
      targets:
        description: "Projects to build: all, xii, xiii, xiii2, lr"
        required: false
        default: "all"
      increment_version:
        description: "Increment VERSION.txt before publishing"
        required: false
        type: boolean
        default: true

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest

    steps:
      - name: Check branch name
        id: branch_check
        shell: pwsh
        run: |
          $shouldPublish = "${{ github.event_name }}" -ne "push" -or "${{ github.ref_name }}" -match '^\d+\.\d+$'
          "should_publish=$($shouldPublish.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Checkout
        if: steps.branch_check.outputs.should_publish == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        if: steps.branch_check.outputs.should_publish == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore solution
        if: steps.branch_check.outputs.should_publish == 'true'
        run: dotnet restore FFModdingWPF.sln

      - name: Publish packages
        if: steps.branch_check.outputs.should_publish == 'true'
        shell: pwsh
        run: |
          $selection = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.targets }}" } else { "all" }
          $incrementVersion = if ("${{ github.event_name }}" -eq "workflow_dispatch") { [System.Convert]::ToBoolean("${{ inputs.increment_version }}") } else { $true }

          ./publish_all.ps1 -Selection $selection -IncrementVersion:$incrementVersion -NoPause

      - name: Verify version files
        if: steps.branch_check.outputs.should_publish == 'true' && github.event_name == 'push'
        shell: pwsh
        run: |
          Write-Host "VERSION.txt:"
          Get-Content VERSION.txt | Select-Object -Last 1
          Write-Host "SetupData.cs version line:"
          Select-String -Path RandoWPF/data/SetupData.cs -Pattern 'public static string Version' | ForEach-Object { $_.Line }

      - name: Commit version bump
        if: steps.branch_check.outputs.should_publish == 'true' && github.event_name == 'push'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          $version = (Get-Content VERSION.txt | Select-Object -Last 1).Trim()
          (Get-Content "RandoWPF/data/SetupData.cs") `
            -replace 'public static string Version \{ get; set; \} = ".*";', "public static string Version { get; set; } = `"$version`";" |
          Set-Content "RandoWPF/data/SetupData.cs"

          git add -- VERSION.txt RandoWPF/data/SetupData.cs

          $stagedFiles = git diff --cached --name-only -- VERSION.txt RandoWPF/data/SetupData.cs
          if (-not [string]::IsNullOrWhiteSpace($stagedFiles)) {
            Write-Host "Staged version files:"
            $stagedFiles
            git commit -m "ci: bump version to $version [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          } else {
            Write-Host "No staged version changes to commit."
          }

      - name: Upload publish archives
        if: steps.branch_check.outputs.should_publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: publish-archives
          path: |
            FF12Rando/bin/publish/FF12Randomizer*.7z
            FF13Rando/bin/publish/FF13Randomizer*.7z
            FF13_2Rando/bin/publish/FF13_2Randomizer*.7z
            LRRando/bin/publish/LRRandomizer*.7z
          if-no-files-found: ignore

      - name: Publish GitHub pre-release
        if: steps.branch_check.outputs.should_publish == 'true' && github.ref_name != '' && startsWith(github.ref, 'refs/heads/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ("${{ github.ref_name }}" -notmatch '^\d+\.\d+$') {
            Write-Host "Branch ${{ github.ref_name }} is not an X.X release branch. Skipping GitHub pre-release publishing."
            exit 0
          }

          $branchVersion = "${{ github.ref_name }}"
          $tagName = "pre-release-$branchVersion"
          $releaseName = "$branchVersion Pre-release"
          $releaseNotes = "Automated pre-release for branch $branchVersion.`n`nThis release is updated in place so there is only one current pre-release link for this release line."
          $assetPatterns = @(
            "FF12Rando/bin/publish/FF12Randomizer*.7z",
            "FF13Rando/bin/publish/FF13Randomizer*.7z",
            "FF13_2Rando/bin/publish/FF13_2Randomizer*.7z",
            "LRRando/bin/publish/LRRandomizer*.7z"
          )

          $assets = @()
          foreach ($pattern in $assetPatterns) {
            $assets += Get-ChildItem -Path $pattern -File -ErrorAction SilentlyContinue
          }

          if ($assets.Count -eq 0) {
            Write-Host "No release assets found. Skipping GitHub pre-release publishing."
            exit 0
          }

          git tag -f $tagName "${{ github.sha }}"
          git push origin "refs/tags/$tagName" --force

          $releaseJson = gh release view $tagName --repo "${{ github.repository }}" --json assets 2>$null
          $releaseExists = $LASTEXITCODE -eq 0

          if (-not $releaseExists) {
            gh release create $tagName @($assets.FullName) --repo "${{ github.repository }}" --target "${{ github.ref_name }}" --title $releaseName --notes $releaseNotes --prerelease
            exit 0
          }

          gh release edit $tagName --repo "${{ github.repository }}" --title $releaseName --notes $releaseNotes --prerelease

          $release = $releaseJson | ConvertFrom-Json
          foreach ($asset in $release.assets) {
            gh release delete-asset $tagName $asset.name --repo "${{ github.repository }}" --yes
          }

          gh release upload $tagName @($assets.FullName) --repo "${{ github.repository }}" --clobber
